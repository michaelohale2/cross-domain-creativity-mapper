[project]
name = "cross-domain-creativity-mapper"
version = "0.1.0"
description = "Multi-agent CrewAI CLI that maps an unusual phenomenon from one domain onto another."
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "crewai[google-genai]>=1.15.30",
    "python-dotenv>=1.2.4",
]

[project.scripts]
creativity-mapper = "creativity_mapper.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/creativity_mapper"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
